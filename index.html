<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CYRIL CRASH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #87CEEB; overflow: hidden; touch-action: none; }
  #gameCanvas { display: block; margin: 0 auto; background: #87CEEB; }
  #title {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: #FFD700;
    text-shadow: 4px 4px 0px #FF4500;
    letter-spacing: 2px;
  }
  #hud {
    position: absolute;
    top: 70px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 4px black;
  }
  #startScreen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    background: rgba(0,0,0,0.8);
    padding: 30px;
    border-radius: 20px;
    max-width: 350px;
  }
</style>
</head>
<body>

<div id="title">CYRIL CRASH</div>
<div id="hud">Score: 0 | Phase: FORÊT</div>
<canvas id="gameCanvas"></canvas>

<div id="startScreen">
  <h2>✈️ CYRIL CRASH ✈️</h2>
  <p>0-500 pts: Forêt facile - grand passage</p>
  <p>500+ pts: Ciel + pluie + tire sur avions</p>
  <p>1000 pts: Atterrissage + voiture minée 🚗💣</p>
  <p style="margin-top:15px; font-size:14px;">Tape gauche: Monter<br>Tape droite: Tirer/Avancer</p>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hudDiv = document.getElementById('hud');
const startScreen = document.getElementById('startScreen');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let phase = 1;
let avion = { x: 120, y: canvas.height/2, vy: 0, size: 30 };
let voiture = { x: 100, y: canvas.height-60, vx: 0, size: 40 };
let arbres = [], ennemis = [], balles = [], mines = [], gouttes = [];
let gravite = 0.35;
let vitesse = 2.5;
let score = 0;
let jeuActif = false;
let tirCooldown = 0;

function dessinerAvion() {
  ctx.save();
  ctx.translate(avion.x, avion.y);
  ctx.rotate(avion.vy * 0.08);
  ctx.fillStyle = '#FF4757';
  ctx.beginPath();
  ctx.ellipse(0, 0, avion.size, avion.size/2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2F3542';
  ctx.fillRect(-avion.size/2, -5, avion.size, 10);
  ctx.fillRect(-avion.size, -12, avion.size/2, 24);
  ctx.fillStyle = '#70A1FF';
  ctx.beginPath();
  ctx.arc(avion.size/2, 0, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.font = '30px Arial';
  ctx.fillText('✈️', -15, 10);
  ctx.restore();
}

function dessinerVoiture() {
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(voiture.x-20, voiture.y-15, 40, 30);
  ctx.fillStyle = '#2F3542';
  ctx.beginPath();
  ctx.arc(voiture.x-12, voiture.y+15, 8, 0, Math.PI*2);
  ctx.arc(voiture.x+12, voiture.y+15, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#70A1FF';
  ctx.fillRect(voiture.x-8, voiture.y-10, 16, 12);
}

function dessinerArbre(x, y, hauteur) {
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x, y, 35, hauteur);
  ctx.fillStyle = '#228B22';
  ctx.beginPath();
  ctx.arc(x+17, y-20, 45, 0, Math.PI*2);
  ctx.fill();
}

function dessinerEnnemi(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = '#57606f';
  ctx.beginPath();
  ctx.ellipse(0, 0, 25, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2f3542';
  ctx.fillRect(-25, -4, 50, 8);
  ctx.font = '24px Arial';
  ctx.fillText('✈️', -12, 8);
  ctx.restore();
}

function creerPluie() {
  if(Math.random() < 0.3) {
    gouttes.push({ x: Math.random()*canvas.width, y: 0, vy: 8+vitesse });
  }
}

function boucle() {
  if(!jeuActif) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let niveau = Math.floor(score/100);
  vitesse = 2.5 + niveau*0.4;
  gravite = 0.35 + niveau*0.03;

  // PHASE 1: FORÊT 0-499 pts - ESPACE 280px
  if(score < 500) {
    phase = 1;
    hudDiv.textContent = `Score: ${score} | Phase: FORÊT | Niveau: ${niveau+1}`;

    let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#87CEEB');
    gradient.addColorStop(0.7, '#90EE90');
    gradient.addColorStop(1, '#228B22');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    avion.vy += gravite;
    avion.y += avion.vy;

    for(let i=0; i<arbres.length; i++) {
      arbres[i].x -= vitesse;
      dessinerArbre(arbres[i].x, 0, arbres[i].hauteur);
      // ESPACE PASSAGE AGRANDI: 280px
      dessinerArbre(arbres[i].x, arbres[i].hauteur+280, canvas.height-arbres[i].hauteur-280);

      if(arbres[i].x+35 < avion.x &&!arbres[i].passe) {
        score++; arbres[i].passe = true;
      }
      if(avion.x+30 > arbres[i].x && avion.x-30 < arbres[i].x+35) {
        if(avion.y-30 < arbres[i].hauteur || avion.y+30 > arbres[i].hauteur+280) gameOver();
      }
    }
    if(arbres.length==0 || arbres[arbres.length-1].x < canvas.width-280) {
      arbres.push({x: canvas.width, hauteur: Math.random()*(canvas.height-380)+100, passe: false});
    }
    if(arbres[0] && arbres[0].x < -50) arbres.shift();
  }

  // PHASE 2: CIEL + PLUIE + TIR 500-999 pts
  else if(score < 1000) {
    phase = 2;
    hudDiv.textContent = `Score: ${score} | Phase: CIEL | Tire!`;

    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    creerPluie();
    gouttes.forEach(g => { g.y += g.vy; ctx.fillStyle='white'; ctx.fillRect(g.x, g.y, 2, 10); });
    gouttes = gouttes.filter(g => g.y < canvas.height);

    avion.vy += gravite;
    avion.y += avion.vy;

    if(Math.random() < 0.03) ennemis.push({x: canvas.width, y: Math.random()*(canvas.height-100)+50});
    ennemis.forEach(e => { e.x -= vitesse+1; dessinerEnnemi(e);
      if(Math.abs(e.x-avion.x)<30 && Math.abs(e.y-avion.y)<25) gameOver();
    });
    ennemis = ennemis.filter(e => e.x > -50);

    if(tirCooldown > 0) tirCooldown--;
    balles.forEach(b => { b.x += 12; ctx.fillStyle='#FFFF00'; ctx.fillRect(b.x, b.y, 15, 4); });
    balles = balles.filter(b => b.x < canvas.width);

    balles.forEach((b,bi) => {
      ennemis.forEach((e,ei) => {
        if(Math.abs(b.x-e.x)<30 && Math.abs(b.y-e.y)<20) {
          ennemis.splice(ei,1); balles.splice(bi,1); score+=2;
        }
      });
    });

    score++;
  }

  // PHASE 3: VOITURE MINÉE 1000+ pts
  else {
    phase = 3;
    hudDiv.textContent = `Score: ${score} | Phase: VOITURE MINÉE!`;

    ctx.fillStyle = '#654321';
    ctx.fillRect(0, canvas.height-60, canvas.width, 60);

    voiture.x += voiture.vx;
    if(voiture.x < 40) voiture.x = 40;
    if(voiture.x > canvas.width-40) voiture.x = canvas.width-40;

    if(Math.random() < 0.02) mines.push({x: Math.random()*canvas.width, y: canvas.height-45});
    mines.forEach(m => {
      ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(m.x, m.y, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='red'; ctx.fillRect(m.x-4, m.y-4, 8, 8);
      if(Math.abs(m.x-voiture.x)<30) gameOver();
    });

    dessinerVoiture();
    score += 0.5;
  }

  if(phase < 3 && (avion.y+30 > canvas.height || avion.y-30 < 0)) gameOver();

  if(phase < 3) dessinerAvion();
  requestAnimationFrame(boucle);
}

function tirer() {
  if(phase==2 && tirCooldown==0) {
    balles.push({x: avion.x+30, y: avion.y});
    tirCooldown = 8;
  }
}

function taper(e) {
  if(!jeuActif) { startJeu(); return; }

  let x = e.touches? e.touches[0].clientX : e.clientX;

  if(phase < 3) {
    if(x < canvas.width/2) avion.vy = -7;
    else tirer();
  } else {
    voiture.vx = x < canvas.width/2? -5 : 5;
    setTimeout(()=>voiture.vx=0, 200);
  }
}

function startJeu() {
  jeuActif = true;
  startScreen.style.display = 'none';
  score = 0; vitesse = 2.5; gravite = 0.35; phase = 1;
  avion.y = canvas.height/2; avion.vy = 0;
  arbres = []; ennemis = []; balles = []; mines = []; gouttes = [];
  boucle();
}

function gameOver() {
  jeuActif = false;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'white';
  ctx.font = '52px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('CRASH! 💥', canvas.width/2, canvas.height/2-60);
  ctx.font = '36px Arial';
  ctx.fillText('Score final: '+Math.floor(score), canvas.width/2, canvas.height/2);
  ctx.font = '22px Arial';
  ctx.fillText('Tape pour recommencer', canvas.width/2, canvas.height/2+60);
}

canvas.addEventListener('click', taper);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); taper(e); });
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>

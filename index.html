<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CYRIL CRASH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF4500">
<link rel="icon" href="icon-167.png" type="image/png">
<link rel="apple-touch-icon" href="icon-166.png">
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Arial Black', Arial, sans-serif;
  background: #000;
  overflow: hidden;
  touch-action: none;
}
#gameCanvas {
  display: block;
  margin: 0 auto;
  filter: contrast(1.1) saturate(1.2);
}
#title {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 52px;
  font-weight: 900;
  background: linear-gradient(45deg, #FFD700, #FFA500, #FF6347);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(255,215,0,0.6), 4px 4px 0px #8B0000;
  letter-spacing: 4px;
  animation: glow 2s ease-in-out infinite alternate;
  z-index: 10;
}
@keyframes glow {
  from { filter: drop-shadow(0 0 10px #FFD700); }
  to { filter: drop-shadow(0 0 25px #FF6347); }
}
#hud {
  position: absolute;
  top: 90px;
  width: 100%;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 10px #00ffff, 2px 2px 8px black;
  background: rgba(0,0,0,0.4);
  padding: 8px;
  backdrop-filter: blur(5px);
  z-index: 10;
}
#startScreen {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
  background: rgba(0,0,0,0.9);
  padding: 35px;
  border-radius: 25px;
  border: 3px solid #FFD700;
  box-shadow: 0 0 40px rgba(255,215,0,0.5);
  max-width: 380px;
  backdrop-filter: blur(10px);
  z-index: 20;
}
#startScreen h2 {
  font-size: 32px;
  margin-bottom: 20px;
  background: linear-gradient(45deg, #FFD700, #fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#menuNiveaux {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
  background: rgba(0,0,0,0.95);
  padding: 25px 20px;
  border-radius: 25px;
  border: 3px solid #FFD700;
  box-shadow: 0 0 40px rgba(255,215,0,0.5);
  width: 85%;
  max-width: 350px;
  max-height: 80vh;
  overflow-y: auto;
  backdrop-filter: blur(10px);
  z-index: 100;
}
#menuNiveaux h2 {
  font-size: 28px;
  margin-bottom: 15px;
  color: #FFD700;
}
#menuNiveaux p {
  margin: 12px 0 5px 0;
  font-size: 16px;
}
#menuNiveaux input {
  padding: 10px;
  margin: 5px 0 10px 0;
  border-radius: 8px;
  border: 2px solid #FFD700;
  background: #222;
  color: white;
  font-size: 15px;
  width: 90%;
}
#menuNiveaux button {
  padding: 12px 25px;
  margin: 5px 0 15px 0;
  background: linear-gradient(45deg, #FFD700, #FF6347);
  border: none;
  border-radius: 10px;
  color: black;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  width: 90%;
}
.whatsapp {
  color: #25D366;
  text-decoration: underline;
  cursor: pointer;
  font-size: 18px;
}
#btnRetour {
  display: none;
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 8px 15px;
  background: rgba(255,0,0,0.85);
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  z-index: 50;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="title">CYRIL CRASH</div>
<div id="hud">Score: 0 | MENU</div>
<button id="btnRetour" onclick="retourMenu()">← MENU</button>
<canvas id="gameCanvas"></canvas>

<audio id="bgMusic" loop preload="auto">
  <source src="PSquare_-_Bring_it_On_[Official_Video]_ft._Dave_Scott(256k).mp3" type="audio/mpeg">
</audio>

<div id="startScreen">
  <h2>✈️ CYRIL CRASH ✈️</h2>
  <p>Choisis ton mode:</p>
  <button onclick="ouvrirMenuAvion()" style="padding:15px 30px; font-size:18px; background:linear-gradient(45deg,#FFD700,#FF6347); border:none; border-radius:12px; color:black; font-weight:bold; margin:10px; cursor:pointer;">AVION LIBRE</button>
  <button onclick="startNiveau(6)" style="padding:15px 30px; font-size:18px; background:linear-gradient(45deg,#1E90FF,#00BFFF); border:none; border-radius:12px; color:white; font-weight:bold; margin:10px; cursor:pointer;">AVION ESPACE</button>
  <p style="margin-top:20px; font-size:14px; color:#ccc;">Niveaux 2-5: Mot de passe requis</p>
  <p style="margin-top:10px;">Besoin du mot de passe?
    <a class="whatsapp" href="https://wa.me/243970709671?text=Bonjour%20Cyril,%20donne-moi%20le%20mot%20de%20passe%20CYRIL%20CRASH%20stp" target="_blank">+243970709671</a>
  </p>
</div>

<div id="menuNiveaux">
  <h2>AVION LIBRE - CHOISIR NIVEAU</h2>

  <p>1. Niveau Facile</p>
  <button onclick="startNiveau(1)">JOUER</button>

  <p>2. Niveau Moyen 🔒</p>
  <input type="password" id="pass2" placeholder="Mot de passe">
  <button onclick="verifierPass(2)">JOUER</button>

  <p>3. Niveau Difficile 🔒</p>
  <input type="password" id="pass3" placeholder="Mot de passe">
  <button onclick="verifierPass(3)">JOUER</button>

  <p>4. Niveau Expert 🔒</p>
  <input type="password" id="pass4" placeholder="Mot de passe">
  <button onclick="verifierPass(4)">JOUER</button>

  <p>5. Niveau Boss 🔒</p>
  <input type="password" id="pass5" placeholder="Mot de passe">
  <button onclick="verifierPass(5)">JOUER</button>

  <button onclick="fermerMenu()" style="background:#555; color:white; margin-top:10px;">RETOUR</button>
  <button id="btnMusic" onclick="toggleMusic()" style="background:#25D366; color:white; margin-top:10px;">🎵 MUSIQUE ON</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hudDiv = document.getElementById('hud');
const startScreen = document.getElementById('startScreen');
const menuNiveaux = document.getElementById('menuNiveaux');
const btnRetour = document.getElementById('btnRetour');
const bgMusic = document.getElementById('bgMusic');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// === AUDIO ===
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();
function playSound(freq, duration, type='sine') {
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

// === MUSIQUE PSQUARE ===
let musicOn = true;
function toggleMusic() {
  musicOn =!musicOn;
  let btn = document.getElementById('btnMusic');
  if(musicOn) {
    btn.textContent = '🎵 MUSIQUE ON';
    btn.style.background = '#25D366';
    bgMusic.play().catch(e => {});
  } else {
    btn.textContent = '🔇 MUSIQUE OFF';
    btn.style.background = '#555';
    bgMusic.pause();
  }
}

// === VARIABLES JEU ===
let niveauActuel = 1;
let sousNiveau = 1;
let avion = { x: 140, y: canvas.height/2, vy: 0, size: 40 };
let balles = [], ennemis = [], arbres = [], fumee = [], nuages = [];
let gravite = 0.32;
let vitesse = 2.3;
let score = 0;
let jeuActif = false;
let tirCooldown = 0;

for(let i=0; i<5; i++) {
  nuages.push({x: Math.random()*canvas.width, y: Math.random()*200, size: 60+Math.random()*40});
}

function dessinerAvionRealiste() {
  ctx.save();
  ctx.translate(avion.x, avion.y);
  ctx.rotate(avion.vy * 0.05);
  let grad = ctx.createLinearGradient(-avion.size, 0, avion.size, 0);
  grad.addColorStop(0, '#B0C4DE');
  grad.addColorStop(0.5, '#E6E6FA');
  grad.addColorStop(1, '#778899');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, avion.size, avion.size/2.5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#4682B4';
  ctx.beginPath();
  ctx.moveTo(-avion.size/2, 0);
  ctx.lineTo(-avion.size, -15);
  ctx.lineTo(avion.size, -15);
  ctx.lineTo(avion.size/2, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-avion.size/2, 0);
  ctx.lineTo(-avion.size, 15);
  ctx.lineTo(avion.size, 15);
  ctx.lineTo(avion.size/2, 0);
  ctx.fill();
  ctx.fillStyle = '#4682B4';
  ctx.beginPath();
  ctx.moveTo(-avion.size, 0);
  ctx.lineTo(-avion.size-15, -10);
  ctx.lineTo(-avion.size-15, 10);
  ctx.fill();
  let cockpit = ctx.createRadialGradient(avion.size/2.5, 0, 0, avion.size/2.5, 0, 10);
  cockpit.addColorStop(0, '#87CEFA');
  cockpit.addColorStop(1, '#1E90FF');
  ctx.fillStyle = cockpit;
  ctx.beginPath();
  ctx.arc(avion.size/2.5, 0, 9, 0, Math.PI*2);
  ctx.fill();
  if(Math.random() < 0.4) {
    fumee.push({x: avion.x-avion.size-10, y: avion.y+Math.random()*6-3, size: 6, life: 25});
  }
  ctx.restore();
  fumee.forEach((f, i) => {
    f.x -= 3; f.size += 0.4; f.life--;
    ctx.fillStyle = `rgba(220,220,220,${f.life/25})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI*2); ctx.fill();
  });
  fumee = fumee.filter(f => f.life > 0);
}

function dessinerEnnemi(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  let grad = ctx.createLinearGradient(-25, 0, 25, 0);
  grad.addColorStop(0, '#37474F'); grad.addColorStop(0.5, '#546E7A'); grad.addColorStop(1, '#263238');
  ctx.fillStyle = grad; ctx.beginPath(); ctx.ellipse(0, 0, 25, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-25, -4, 50, 8);
  ctx.font = '26px Arial'; ctx.fillText('✈️', -13, 9);
  ctx.restore();
}

function dessinerArbre(x, y, h) {
  let grad = ctx.createLinearGradient(x, 0, x+35, 0);
  grad.addColorStop(0, '#5D4037'); grad.addColorStop(0.5, '#8B4513'); grad.addColorStop(1, '#3E2723');
  ctx.fillStyle = grad; ctx.fillRect(x, y, 35, h);
  let feuille = ctx.createRadialGradient(x+17, y-25, 0, x+17, y-25, 50);
  feuille.addColorStop(0, '#2E7D32'); feuille.addColorStop(1, '#0D3B13');
  ctx.fillStyle = feuille; ctx.beginPath(); ctx.arc(x+17, y-25, 50, 0, Math.PI*2); ctx.fill();
}

function dessinerNuages() {
  nuages.forEach(n => {
    n.x -= 0.5;
    if(n.x < -100) n.x = canvas.width + 100;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.size, 0, Math.PI*2);
    ctx.arc(n.x+30, n.y+10, n.size*0.8, 0, Math.PI*2);
    ctx.arc(n.x-30, n.y+10, n.size*0.7, 0, Math.PI*2);
    ctx.fill();
  });
}

function boucle() {
  if(!jeuActif) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Difficulté selon sous-niveau Avion Libre
  let mult = sousNiveau == 1? 1 : sousNiveau == 2? 1.3 : sousNiveau == 3? 1.6 : sousNiveau == 4? 2 : 2.5;
  vitesse = (2.3 + Math.floor(score/100)*0.3) * mult;
  gravite = (0.32 + Math.floor(score/100)*0.02) * mult;

  // === AVION LIBRE NIVEAUX 1-5 ===
  if(niveauActuel >= 1 && niveauActuel <= 5) {
    hudDiv.textContent = `Score: ${score} | Avion Libre Niv${sousNiveau}`;
    let ciel = ctx.createLinearGradient(0, 0, 0, canvas.height);
    ciel.addColorStop(0, '#87CEEB'); ciel.addColorStop(1, '#228B22');
    ctx.fillStyle = ciel; ctx.fillRect(0, 0, canvas.width, canvas.height);
    dessinerNuages();
    avion.vy += gravite; avion.y += avion.vy;

    // Espace 350px pour que ça passe facile
    for(let i=0; i<arbres.length; i++) {
      arbres[i].x -= vitesse;
      dessinerArbre(arbres[i].x, 0, arbres[i].hauteur);
      dessinerArbre(arbres[i].x, arbres[i].hauteur+350, canvas.height-arbres[i].hauteur-350);
      if(arbres[i].x+35 < avion.x &&!arbres[i].passe) { score++; arbres[i].passe = true; }
      if(avion.x+35 > arbres[i].x && avion.x-35 < arbres[i].x+35) {
        if(avion.y-35 < arbres[i].hauteur || avion.y+35 > arbres[i].hauteur+350) gameOver();
      }
    }
    if(arbres.length==0 || arbres[arbres.length-1].x < canvas.width-300) {
      arbres.push({x: canvas.width, hauteur: Math.random()*(canvas.height-450)+150, passe: false});
    }
    if(arbres[0] && arbres[0].x < -60) arbres.shift();

    if(tirCooldown > 0) tirCooldown--;
    balles.forEach(b => {
      b.x += 14;
      ctx.shadowBlur = 10; ctx.shadowColor = '#FFFF00';
      ctx.fillStyle = '#FFFF00'; ctx.fillRect(b.x, b.y-2, 18, 4); ctx.shadowBlur = 0;
    });
    balles = balles.filter(b => b.x < canvas.width);

    score++;
    if(avion.y+40 > canvas.height || avion.y-40 < 0) gameOver();
    dessinerAvionRealiste();
  }

  // === AVION ESPACE NIVEAU 6 ===
  else if(niveauActuel == 6) {
    hudDiv.textContent = `Score: ${score} | AVION ESPACE`;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    for(let i=0; i<150; i++) {
      ctx.fillStyle = 'white'; ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
    }
    dessinerAvionRealiste();
    avion.vy += gravite*0.5; avion.y += avion.vy;

    // Ennemis dès le début
    if(Math.random() < 0.04) {
      ennemis.push({x: canvas.width, y: Math.random()*(canvas.height-100)+50});
    }
    ennemis.forEach(e => {
      e.x -= vitesse+2;
      dessinerEnnemi(e);
      if(Math.abs(e.x-avion.x)<35 && Math.abs(e.y-avion.y)<28) gameOver();
    });
    ennemis = ennemis.filter(e => e.x > -60);

    if(tirCooldown > 0) tirCooldown--;
    balles.forEach(b => {
      b.x += 14;
      ctx.shadowBlur = 10; ctx.shadowColor = '#00FFFF';
      ctx.fillStyle = '#00FFFF'; ctx.fillRect(b.x, b.y-2, 18, 4); ctx.shadowBlur = 0;
    });
    balles = balles.filter(b => b.x < canvas.width);
    balles.forEach((b,bi) => {
      ennemis.forEach((e,ei) => {
        if(Math.abs(b.x-e.x)<35 && Math.abs(b.y-e.y)<22) {
          playSound(800, 0.1); ennemis.splice(ei,1); balles.splice(bi,1); score+=3;
        }
      });
    });

    score += 2;
    if(avion.y+40 > canvas.height || avion.y-40 < 0) gameOver();
  }

  requestAnimationFrame(boucle);
}

function tirer() {
  if(tirCooldown==0) {
    balles.push({x: avion.x+40, y: avion.y});
    playSound(900, 0.05, 'square');
    tirCooldown = 6;
  }
}

function taper(e) {
  if(!jeuActif) return;
  let x = e.touches? e.touches[0].clientX : e.clientX;
  if(x < canvas.width/2) {
    avion.vy = -6.5;
    playSound(300, 0.05);
  } else {
    tirer();
  }
}

// === MENU AVEC MOT DE PASSE ===
function ouvrirMenuAvion() {
  startScreen.style.display = 'none';
  menuNiveaux.style.display = 'block';
}
function fermerMenu() {
  menuNiveaux.style.display = 'none';
  startScreen.style.display = 'block';
}
function verifierPass(niv) {
  let pass = document.getElementById('pass'+niv).value;
  if(pass === 'Vanessacyril') {
    startNiveau(niv);
  } else {
    alert('Mot de passe incorrect!');
  }
}
function startNiveau(niv) {
  audioCtx.resume();
  if(musicOn) {
    bgMusic.play().catch(e => console.log('Clique pour activer musique'));
  }

  jeuActif = true;
  menuNiveaux.style.display = 'none';
  startScreen.style.display = 'none';
  btnRetour.style.display = 'block';

  if(niv >= 1 && niv <= 5) {
    niveauActuel = 1; // mode avion libre
    sousNiveau = niv;
  } else {
    niveauActuel = 6; // mode espace
    sousNiveau = 1;
  }

  score = 0; vitesse = 2.3; gravite = 0.32;
  avion.y = canvas.height/2; avion.vy = 0;
  arbres = []; ennemis = []; balles = []; fumee = [];
  boucle();
}

function retourMenu() {
  jeuActif = false;
  bgMusic.pause();
  bgMusic.currentTime = 0;
  btnRetour.style.display = 'none';
  hudDiv.textContent = `Score: 0 | MENU`;
  fermerMenu();
}

function gameOver() {
  jeuActif = false;
  bgMusic.pause();
  bgMusic.currentTime = 0;
  btnRetour.style.display = 'none';
  playSound(100, 0.8, 'sawtooth');
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#FF6347';
  ctx.font = 'bold 56px Arial';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 20; ctx.shadowColor = '#FF6347';
  ctx.fillText('CRASH! 💥', canvas.width/2, canvas.height/2-70);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'white';
  ctx.font = '38px Arial';
  ctx.fillText('Score: '+Math.floor(score), canvas.width/2, canvas.height/2);
  ctx.font = '24px Arial';
  ctx.fillText('Tape pour recommencer', canvas.width/2, canvas.height/2+70);
}

canvas.addEventListener('click', taper);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); taper(e); });
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
